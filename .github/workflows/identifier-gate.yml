name: identifier-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # Scans every blob, path and commit (message, names, emails) reachable from HEAD.
    # Output is redacted: locations and pattern ids only, never matched text or patterns.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tree and history for private identifiers
        shell: bash
        env:
          EXO_IDENTIFIERS: ${{ secrets.EXO_IDENTIFIERS }}
          EXO_GATE_REDACT: "1"
          PYTHONUTF8: "1"
        run: |
          if [ -z "$EXO_IDENTIFIERS" ]; then
            echo "::error::Secret EXO_IDENTIFIERS is unavailable (e.g. a fork pull request); private identifiers were NOT checked. Failing closed."
            exit 1
          fi
          list="$RUNNER_TEMP/identifiers.yaml"
          (umask 077 && printf '%s\n' "$EXO_IDENTIFIERS" > "$list")
          unset EXO_IDENTIFIERS
          EXO_IDENTIFIERS_FILE="$list" python tools/identifier_gate.py --redact history HEAD
      - name: Hooks are executable (mode 100755)
        # git skips a hook that is not executable with only a hint, so the gate would go silent.
        # Runs even when the scan failed, so both results are reported.
        if: success() || failure()
        shell: bash
        run: |
          listing=$(git ls-files -s -- .githooks)
          if [ -z "$listing" ]; then
            echo "::error::No files are tracked under .githooks."
            exit 1
          fi
          bad=0
          while IFS=$'\t' read -r meta path; do
            mode=${meta%% *}
            if [ "$mode" != "100755" ]; then
              echo "::error file=$path::$path is mode $mode, not 100755; git would skip it. Fix: git update-index --chmod=+x $path"
              bad=1
            fi
          done <<< "$listing"
          exit "$bad"

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the floor for tools/ and src/exocortex_engine.
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Identifier gate and /exo:project core (tests/test_*.py); synthetic data only.
      - name: Unit tests (synthetic data only)
        run: python -m unittest discover -s tests -v
